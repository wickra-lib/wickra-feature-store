# OSV-Scanner suppressions (VEX record). Consumed by OSV-Scanner and the
# OpenSSF Scorecard Vulnerabilities check. Each entry would be an advisory
# assessed as not affecting wickra-feature-store; this mirrors the cargo-deny
# `ignore` list in deny.toml at the OSV layer.
#
# Keep in lock-step with deny.toml's [advisories].ignore. No suppressions yet.

# `paste` 1.0.15 reaches the lockfile through `parquet`, which is behind the
# optional `arrow` feature. The advisory is a maintenance notice -- the crate is
# unmaintained -- not a vulnerability: it names no flaw and offers no fixed
# version, because there is nothing to fix.
#
# It is also a proc-macro: it runs at build time and no part of it is linked into
# anything this repository publishes. Revisit when `parquet` drops it, at which
# point this entry can go.
[[IgnoredVulns]]
id = "RUSTSEC-2024-0436"
reason = """
paste is an unmaintained proc-macro reached through parquet, behind the optional
arrow feature. The advisory reports the crate's maintenance status and names no
flaw; being a proc-macro, it runs at build time and is linked into nothing that
ships. There is no fixed version to take.
"""

# pytest 8.4.2 in .github/requirements/ci-dev-py39.txt. The advisory covers
# pytest through 9.0.2, so this pin is inside it; ci-dev-py3.txt is on 9.1.1 and
# is not.
#
# The 3.9 row cannot move: pytest >= 9.0 declares requires-python >= 3.10, so
# taking the fixed version there means dropping Python 3.9 from the support
# matrix -- a decision about who can install wickra-feature-store, not about
# this advisory. It resolves itself when 3.9 goes.
[[IgnoredVulns]]
id = "GHSA-6w46-j5rx-g56g"
reason = """
pytest is a CI-only test dependency and is never shipped in any published
artefact. The flaw is local (CVSS AV:L): it needs a second user on the machine
to pre-create /tmp/pytest-of-<user>, which a single-user ephemeral GitHub runner
does not have. Pinned at 8.4.2 because pytest 9 requires Python >= 3.10 and the
3.9 matrix row needs a version that installs there.
"""
